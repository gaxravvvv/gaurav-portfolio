<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="charcoalCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#141829" />
      <stop offset="60%" stop-color="#0a0d18" />
      <stop offset="100%" stop-color="#04060b" />
    </radialGradient>
    
    <!-- Neon Electric Blue & Violet Gradients -->
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <linearGradient id="violetAcc" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="blueAcc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <!-- Filters -->
    <filter id="bloom" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Charcoal Base Plate -->
  <circle cx="210" cy="210" r="195" fill="url(#charcoalCore)" stroke="rgba(139, 92, 246, 0.25)" stroke-width="2" />

  <!-- Outer Orbit Rings (Technical Caliper & Coordinate Markers) -->
  <circle cx="210" cy="210" r="202" fill="none" stroke="rgba(0, 242, 254, 0.4)" stroke-width="1.5" stroke-dasharray="10 16" />
  <circle cx="210" cy="210" r="182" fill="none" stroke="rgba(139, 92, 246, 0.35)" stroke-width="1" stroke-dasharray="4 8" />

  <!-- Background Technical Gear Silhouette -->
  <g transform="translate(210, 210) rotate(22)">
    <circle cx="0" cy="0" r="140" fill="none" stroke="rgba(56, 189, 248, 0.12)" stroke-width="14" stroke-dasharray="18 18" />
    <circle cx="0" cy="0" r="122" fill="none" stroke="rgba(139, 92, 246, 0.1)" stroke-width="1" />
  </g>

  <!-- Crosshair Coordinate Ticks -->
  <path d="M 25 210 H 55 M 365 210 H 395 M 210 25 V 55 M 210 365 V 395" stroke="#00f2fe" stroke-width="2" opacity="0.6"/>
  <circle cx="210" cy="210" r="3.5" fill="#8b5cf6" opacity="0.8"/>

  <!-- Glowing Background Orb Behind Emblem -->
  <circle cx="210" cy="190" r="85" fill="#8b5cf6" opacity="0.12" filter="url(#bloom)" />
  <circle cx="210" cy="190" r="60" fill="#00f2fe" opacity="0.1" filter="url(#bloom)" />

  <!-- Mechanical Engineering Emblem / Stylized Silhouette -->
  <g transform="translate(210, 185)">
    <!-- Hexagonal Precision Chassis -->
    <polygon points="0,-75 65,-37 65,37 0,75 -65,37 -65,-37" fill="rgba(16, 21, 40, 0.85)" stroke="url(#neonGlow)" stroke-width="2.5" filter="url(#softGlow)"/>
    
    <!-- Concentric Inner Hexagon -->
    <polygon points="0,-60 52,-30 52,30 0,60 -52,30 -52,-30" fill="none" stroke="rgba(139, 92, 246, 0.3)" stroke-width="1.5" stroke-dasharray="8 6"/>

    <!-- Prominent Monogram: "GS" for Gaurav Sehra -->
    <text x="0" y="22" font-family="'Outfit', 'Plus Jakarta Sans', sans-serif" font-size="54" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">
      GS
    </text>

    <!-- Caliper / Compass Vector Motif over Monogram -->
    <path d="M -30 -38 L 0 -58 L 30 -38" fill="none" stroke="#00f2fe" stroke-width="3" stroke-linecap="round"/>
    <circle cx="0" cy="-58" r="4" fill="#00f2fe" filter="url(#softGlow)"/>
    <circle cx="-30" cy="-38" r="3" fill="#8b5cf6"/>
    <circle cx="30" cy="-38" r="3" fill="#8b5cf6"/>
  </g>

  <!-- Technical Engineering Spec Overlay Chips -->
  <!-- Left Badge: Mech Eng -->
  <g transform="translate(68, 140)">
    <rect x="0" y="0" width="76" height="24" rx="6" fill="#090d1a" stroke="rgba(0, 242, 254, 0.4)" stroke-width="1.2"/>
    <text x="38" y="16" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="bold" fill="#00f2fe" text-anchor="middle">CAD/MECH</text>
  </g>

  <!-- Right Badge: JECRC -->
  <g transform="translate(276, 140)">
    <rect x="0" y="0" width="76" height="24" rx="6" fill="#090d1a" stroke="rgba(139, 92, 246, 0.4)" stroke-width="1.2"/>
    <text x="38" y="16" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="bold" fill="#c084fc" text-anchor="middle">JECRC UNIV</text>
  </g>

  <!-- Bottom Identity Banner -->
  <g transform="translate(210, 345)">
    <rect x="-130" y="-16" width="260" height="32" rx="16" fill="#070a14" stroke="url(#neonGlow)" stroke-width="1.5" filter="url(#softGlow)"/>
    <text x="0" y="5" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="1.5">
      GAURAV SEHRA <tspan fill="#00f2fe">•</tspan> <tspan fill="#c084fc">2026–2030</tspan>
    </text>
  </g>
</svg>
