<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071126" />
      <stop offset="100%" stop-color="#0c1b3f" />
    </linearGradient>
    <pattern id="cadGrid1" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(56, 189, 248, 0.08)" stroke-width="1"/>
      <circle cx="30" cy="30" r="1.5" fill="rgba(0, 242, 254, 0.2)"/>
    </pattern>
  </defs>

  <!-- Background Canvas -->
  <rect width="600" height="360" fill="url(#bgGrad1)"/>
  <rect width="600" height="360" fill="url(#cadGrid1)"/>

  <!-- Blueprint Dimension Lines & Headers -->
  <text x="30" y="35" font-family="'JetBrains Mono', monospace" font-size="12" fill="#38bdf8" letter-spacing="1">CAD-MECH-01 // KINEMATIC SIMULATION</text>
  <text x="570" y="35" font-family="'JetBrains Mono', monospace" font-size="11" fill="rgba(148, 163, 184, 0.7)" text-anchor="end">AUTOCAD / SOLIDWORKS</text>
  <line x1="30" y1="45" x2="570" y2="45" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1" />

  <!-- Spur Gears System -->
  <!-- Big Gear -->
  <g transform="translate(200, 190)">
    <!-- Pitch Circle & Root Circle -->
    <circle cx="0" cy="0" r="105" fill="none" stroke="rgba(0, 242, 254, 0.3)" stroke-width="1.5" stroke-dasharray="6 4" />
    <circle cx="0" cy="0" r="90" fill="#0d2047" stroke="#38bdf8" stroke-width="2" />
    <!-- Gear Teeth (Rotated) -->
    <g stroke="#38bdf8" stroke-width="4" stroke-linecap="round">
      <line x1="0" y1="-100" x2="0" y2="-88"/>
      <line x1="38" y1="-92" x2="33" y2="-81"/>
      <line x1="70" y1="-70" x2="62" y2="-62"/>
      <line x1="92" y1="-38" x2="81" y2="-33"/>
      <line x1="100" y1="0" x2="88" y2="0"/>
      <line x1="92" y1="38" x2="81" y2="33"/>
      <line x1="70" y1="70" x2="62" y2="62"/>
      <line x1="38" y1="92" x2="33" y2="81"/>
      <line x1="0" y1="100" x2="0" y2="88"/>
      <line x1="-38" y1="92" x2="-33" y2="81"/>
      <line x1="-70" y1="70" x2="-62" y2="62"/>
      <line x1="-92" y1="38" x2="-81" y2="33"/>
      <line x1="-100" y1="0" x2="-88" y2="0"/>
      <line x1="-92" y1="-38" x2="-81" y2="-33"/>
      <line x1="-70" y1="-70" x2="-62" y2="-62"/>
      <line x1="-38" y1="-92" x2="-33" y2="-81"/>
    </g>
    <!-- Gear Spokes -->
    <circle cx="0" cy="0" r="45" fill="#0a1633" stroke="#00f2fe" stroke-width="2"/>
    <circle cx="0" cy="0" r="16" fill="#1e3a6d" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="0" cy="0" r="4" fill="#00f2fe"/>
    <line x1="-70" y1="0" x2="70" y2="0" stroke="rgba(56, 189, 248, 0.4)" stroke-width="2"/>
    <line x1="0" y1="-70" x2="0" y2="70" stroke="rgba(56, 189, 248, 0.4)" stroke-width="2"/>
  </g>

  <!-- Small Pinion Gear -->
  <g transform="translate(340, 130)">
    <circle cx="0" cy="0" r="55" fill="none" stroke="rgba(0, 242, 254, 0.3)" stroke-width="1.5" stroke-dasharray="4 4" />
    <circle cx="0" cy="0" r="46" fill="#0e234e" stroke="#00f2fe" stroke-width="2" />
    <g stroke="#00f2fe" stroke-width="3.5" stroke-linecap="round">
      <line x1="0" y1="-52" x2="0" y2="-44"/>
      <line x1="37" y1="-37" x2="31" y2="-31"/>
      <line x1="52" y1="0" x2="44" y2="0"/>
      <line x1="37" y1="37" x2="31" y2="31"/>
      <line x1="0" y1="52" x2="0" y2="44"/>
      <line x1="-37" y1="37" x2="-31" y2="31"/>
      <line x1="-52" y1="0" x2="-44" y2="0"/>
      <line x1="-37" y1="-37" x2="-31" y2="-31"/>
    </g>
    <circle cx="0" cy="0" r="20" fill="#071126" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="6" fill="#00f2fe"/>
  </g>

  <!-- 4-Bar Linkage Overlay -->
  <g stroke="#00f2fe" stroke-width="3" stroke-linecap="round">
    <line x1="340" y1="130" x2="470" y2="190" stroke="#f59e0b" stroke-width="3.5"/>
    <line x1="470" y1="190" x2="430" y2="290" stroke="#38bdf8" stroke-width="3"/>
    <line x1="430" y1="290" x2="200" y2="190" stroke="#10b981" stroke-width="2.5" stroke-dasharray="6 4"/>
  </g>
  <!-- Linkage Pivot Points -->
  <circle cx="470" cy="190" r="8" fill="#f59e0b" stroke="#ffffff" stroke-width="2"/>
  <circle cx="430" cy="290" r="8" fill="#38bdf8" stroke="#ffffff" stroke-width="2"/>

  <!-- Dimension Arc and Annotation -->
  <path d="M 200 130 A 60 60 0 0 1 250 160" fill="none" stroke="#f43f5e" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text x="255" y="150" font-family="'JetBrains Mono', monospace" font-size="10" fill="#f43f5e">θ = 38.5°</text>

  <!-- Bottom Coordinates -->
  <line x1="30" y1="320" x2="570" y2="320" stroke="rgba(56, 189, 248, 0.2)" stroke-width="1" />
  <text x="30" y="340" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94a3b8">SCALE: 1:1  |  PITCH DIA: 180mm  |  TEETH: Z1=36, Z2=18</text>
  <text x="570" y="340" font-family="'JetBrains Mono', monospace" font-size="10" fill="#00f2fe" text-anchor="end">STATUS: VERIFIED</text>
</svg>
