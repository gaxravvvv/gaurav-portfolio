<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081024" />
      <stop offset="100%" stop-color="#0e1f40" />
    </linearGradient>
    <pattern id="pcbGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="rgba(16, 185, 129, 0.08)" stroke-width="1"/>
      <circle cx="12" cy="12" r="1" fill="rgba(0, 242, 254, 0.15)"/>
    </pattern>
  </defs>

  <rect width="600" height="360" fill="url(#bgGrad2)"/>
  <rect width="600" height="360" fill="url(#pcbGrid)"/>

  <!-- Header -->
  <text x="30" y="35" font-family="'JetBrains Mono', monospace" font-size="12" fill="#10b981" letter-spacing="1">MECHATRONICS-02 // AUTONOMOUS CHASSIS PROTOTYPE</text>
  <text x="570" y="35" font-family="'JetBrains Mono', monospace" font-size="11" fill="rgba(148, 163, 184, 0.7)" text-anchor="end">ARDUINO / SENSORS / C++</text>
  <line x1="30" y1="45" x2="570" y2="45" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1" />

  <!-- Robot Chassis Top View -->
  <!-- Acrylic Chassis plate -->
  <rect x="210" y="100" width="180" height="180" rx="20" fill="rgba(15, 23, 42, 0.85)" stroke="#38bdf8" stroke-width="2.5" />
  
  <!-- Left and Right Wheels -->
  <rect x="180" y="130" width="26" height="70" rx="6" fill="#1e293b" stroke="#00f2fe" stroke-width="2"/>
  <line x1="180" y1="145" x2="206" y2="145" stroke="#38bdf8"/>
  <line x1="180" y1="165" x2="206" y2="165" stroke="#38bdf8"/>
  <line x1="180" y1="185" x2="206" y2="185" stroke="#38bdf8"/>

  <rect x="394" y="130" width="26" height="70" rx="6" fill="#1e293b" stroke="#00f2fe" stroke-width="2"/>
  <line x1="394" y1="145" x2="420" y2="145" stroke="#38bdf8"/>
  <line x1="394" y1="165" x2="420" y2="165" stroke="#38bdf8"/>
  <line x1="394" y1="185" x2="420" y2="185" stroke="#38bdf8"/>

  <!-- Front Caster Wheel -->
  <circle cx="300" cy="255" r="14" fill="#334155" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="300" cy="255" r="5" fill="#f8fafc"/>

  <!-- Microcontroller Board (Arduino style) -->
  <rect x="240" y="135" width="120" height="85" rx="6" fill="#006699" stroke="#38bdf8" stroke-width="1.5" />
  <text x="250" y="155" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold" fill="#ffffff">ATmega328P</text>
  <rect x="250" y="165" width="28" height="42" fill="#0f172a" stroke="#64748b" stroke-width="1"/>
  <!-- Pin Headers -->
  <g fill="#f59e0b">
    <circle cx="285" cy="142" r="2"/><circle cx="295" cy="142" r="2"/><circle cx="305" cy="142" r="2"/><circle cx="315" cy="142" r="2"/><circle cx="325" cy="142" r="2"/><circle cx="335" cy="142" r="2"/><circle cx="345" cy="142" r="2"/>
    <circle cx="285" cy="210" r="2"/><circle cx="295" cy="210" r="2"/><circle cx="305" cy="210" r="2"/><circle cx="315" cy="210" r="2"/><circle cx="325" cy="210" r="2"/><circle cx="335" cy="210" r="2"/><circle cx="345" cy="210" r="2"/>
  </g>

  <!-- Ultrasonic Sensor (HC-SR04) at Front -->
  <rect x="255" y="75" width="90" height="24" rx="4" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5"/>
  <circle cx="275" cy="87" r="9" fill="#0f172a" stroke="#cbd5e1" stroke-width="2"/>
  <circle cx="325" cy="87" r="9" fill="#0f172a" stroke="#cbd5e1" stroke-width="2"/>
  <circle cx="275" cy="87" r="3" fill="#38bdf8"/>
  <circle cx="325" cy="87" r="3" fill="#38bdf8"/>

  <!-- Ultrasonic Waves Simulation -->
  <path d="M 270 65 A 30 30 0 0 1 330 65" fill="none" stroke="rgba(0, 242, 254, 0.7)" stroke-width="2" stroke-linecap="round"/>
  <path d="M 255 52 A 50 50 0 0 1 345 52" fill="none" stroke="rgba(0, 242, 254, 0.4)" stroke-width="1.5" stroke-dasharray="4 4"/>
  <path d="M 240 40 A 70 70 0 0 1 360 40" fill="none" stroke="rgba(0, 242, 254, 0.2)" stroke-width="1.5" stroke-dasharray="2 4"/>

  <!-- Wiring connections -->
  <path d="M 260 99 V 135 M 270 99 V 135 M 330 99 V 135 M 340 99 V 135" stroke="#f43f5e" stroke-width="1.5"/>
  
  <!-- Circuit Traces to Motors -->
  <path d="M 240 180 H 206 M 360 180 H 394" stroke="#eab308" stroke-width="2" stroke-dasharray="3 3"/>

  <!-- Footer Stats -->
  <line x1="30" y1="320" x2="570" y2="320" stroke="rgba(16, 185, 129, 0.2)" stroke-width="1" />
  <text x="30" y="340" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94a3b8">RANGE: 2cm - 400cm  |  MOTOR: DUAL DC 150 RPM  |  POWER: 9V LI-ION</text>
  <text x="570" y="340" font-family="'JetBrains Mono', monospace" font-size="10" fill="#10b981" text-anchor="end">STATUS: BENCH TESTED</text>
</svg>
